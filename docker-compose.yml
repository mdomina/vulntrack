version: '3.8'

services:
  vulntrack_backend:
    build: ./backend/
    image: vulntrack/backend:1.2
    container_name: vulntrack_backend
    restart: always
    environment:
      - MONGODB_HOST=mongo-host
      - MONGODB_PORT=mongo-port
      - PWNDOC_HOST=pwndoc-mongo-host
      - PWNDOC_PORT=pwdoc-mongo-port
  
  vulntrack_frontend:
    build:
      context: ./frontend/
      args:
        VUE_APP_BACKEND_URL: "https://backend-ip/api"
    image: vulntrack/frontend:1.2
    container_name: vulntrack_frontend
    restart: always
  
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - vulntrack_frontend
      - vulntrack_backend
