version: '3.8'

services:
  vulntrack_backend:
    build: ./backend/
    image: vulntrack/backend:1.0
    container_name: vulntrack_backend
    restart: always
    ports:
      - 8000:80
    environment:
      - MONGODB_HOST=vuln_db
      - MONGODB_PORT=27017
    networks:
      - pwndoc_backend
    
  vulntrack_frontend:
    build: ./frontend/
    image: vulntrack/frontend:1.0
    container_name: vulntrack_frontend
    restart: always
    ports:
      - 8080:80
    

networks:
  pwndoc_backend:
    driver: bridge
    name: pwndoc_backend
    external: true
