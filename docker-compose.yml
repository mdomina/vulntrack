version: '3.8'

services:
  vulntrack_backend:
    build: ./backend/
    image: vulntrack/backend:1.0
    container_name: vulntrack_backend
    restart: always
    environment:
      - MONGODB_HOST=172.31.41.88
      - MONGODB_PORT=27017
      - PWNDOC_HOST=172.31.41.88
      - PWNDOC_PORT=27017
  
  vulntrack_frontend:
    build:
      context: ./frontend/
      args:
        VUE_APP_BACKEND_URL: "https://192.168.204.129/api"
    image: vulntrack/frontend:1.0
    container_name: vulntrack_frontend
    restart: always
  
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - 443:443
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - vulntrack_frontend
      - vulntrack_backend
